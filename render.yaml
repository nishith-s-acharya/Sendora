services:
  # 1. Backend REST API
  - type: web
    name: sendora-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sendora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sendora-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: 2000

  # 2. BullMQ Email Worker Daemon
  - type: worker
    name: sendora-worker
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sendora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sendora-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: sendora-api
          envVarKey: JWT_SECRET
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: 2000

  # 3. React Frontend Dashboard
  - type: web
    name: sendora-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 4. Managed Redis
  - type: redis
    name: sendora-redis
    plan: free
    ipAllowList: []

# 5. Managed PostgreSQL Database
databases:
  - name: sendora-postgres
    plan: free
    databaseName: sendora_db
    user: sendora_user
