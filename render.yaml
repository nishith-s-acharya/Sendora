services:
  # 1. Backend REST API + BullMQ Worker (Combined on 1 Free Web Service)
  - type: web
    name: sendora-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start:all
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sendora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sendora-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: 2000

  # 2. React Frontend Static Dashboard (Free static site)
  - type: web
    name: sendora-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Managed Redis
  - type: redis
    name: sendora-redis
    plan: free
    ipAllowList: []

# 4. Managed PostgreSQL Database
databases:
  - name: sendora-postgres
    plan: free
    databaseName: sendora_db
    user: sendora_user
